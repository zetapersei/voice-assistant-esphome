esphome:
  name: assistente-vocale
  friendly_name: Assistente Vocale
  min_version: 2025.5.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Assistente-Vocale Fallback"
    password: !secret fallback_password

captive_portal:

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO5

microphone:
  - platform: i2s_audio
    id: microfono_i2s
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO4
    adc_type: external
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: altoparlante_i2s
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO16
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    buffer_duration: 100ms

micro_wake_word:
  microphone:
    microphone: microfono_i2s
    channels: 0
    gain_factor: 4
  task_stack_in_psram: true
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: microfono_i2s
  speaker: altoparlante_i2s
  use_wake_word: true
  on_end:
    - micro_wake_word.start:
  on_error:
    - micro_wake_word.start: